name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          dirname "$(readlink -f "$(command -v pg_dump)")"
      - name: Start an isolated database
        run: |
          set -euo pipefail
          # Ubuntu 的 /usr/bin/pg_dump 是 pg_wrapper，同目录没有 initdb。
          INITDB="$(find /usr/lib/postgresql -type f -name initdb | sort | tail -n 1)"
          test -n "$INITDB"
          BIN="$(dirname "$INITDB")"
          echo "MARKETREVIEW_PG_BIN=$BIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pg/socket"
          "$BIN/initdb" \
            -D "$RUNNER_TEMP/pg/data" \
            -U postgres \
            --auth=trust \
            --encoding=UTF8 \
            --locale=C \
            --no-instructions
          "$BIN/pg_ctl" \
            -D "$RUNNER_TEMP/pg/data" \
            -l "$RUNNER_TEMP/pg/server.log" \
            -w \
            -o "-p 55432 -c listen_addresses=127.0.0.1 -k $RUNNER_TEMP/pg/socket" \
            start
          echo "MARKETREVIEW_PGPORT=55432" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
